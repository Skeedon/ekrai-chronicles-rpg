<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЭКРАЙ — Хроники Разлома</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#263047,#0a0d15 65%);color:#e8e8ef;font:16px/1.5 system-ui,Arial}main{max-width:960px;margin:25px auto;padding:18px}header{text-align:center;margin-bottom:20px}h1{color:#e8c17c;letter-spacing:3px}h2{color:#e8c17c}section{background:#161d2c;border:1px solid #3c4557;border-radius:14px;padding:20px;margin:12px 0;box-shadow:0 10px 30px #0004}button{background:#384c72;color:white;border:1px solid #7c91b5;padding:11px 15px;margin:5px;border-radius:8px;cursor:pointer;font:inherit}button:hover{background:#526e9d}button:disabled{opacity:.35;cursor:not-allowed}.danger{background:#733c46}.gold{background:#775b2d}.muted{color:#b2bacd}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats span{background:#28334b;padding:7px 12px;border-radius:8px}.log{height:220px;overflow:auto;background:#0c1220;border-radius:8px;padding:12px;white-space:pre-wrap}.hidden{display:none}.hp{height:10px;background:#402c36;border-radius:8px;overflow:hidden;margin:6px 0 12px}.hp i{display:block;height:100%;background:#b94b61}.hero{background:#29364d;padding:14px;border-radius:8px}#story{font-size:18px}footer{text-align:center;color:#7c869c;margin-top:20px}
</style></head><body><main><header><h1>⚔ ЭКРАЙ</h1><div class="muted">Хроники Разлома · тактическая текстовая RPG</div></header>
<section id="start"><h2>Пробуждение</h2><p>Разлом расколол границу миров. Три пути ведут к сердцу катастрофы. Выбери героя.</p><button onclick="start('Страж')">🛡 Страж — крепкая защита</button><button onclick="start('Арканист')">✨ Арканист — сильная магия</button><button onclick="start('Следопыт')">🏹 Следопыт — ловкость и критические удары</button><p><button onclick="load()">Продолжить сохранение</button></p></section>
<section id="game" class="hidden"><div class="stats" id="stats"></div><h2 id="chapter"></h2><p id="story"></p><div id="enemyBox" class="hidden"><strong id="enemyName"></strong><div class="hp"><i id="enemyHp"></i></div><div class="stats" id="enemyStats"></div></div><div id="actions"></div><h3>Хроника</h3><div class="log" id="log"></div><p><button onclick="save()">💾 Сохранить</button><button onclick="reset()" class="danger">Новая игра</button></p></section><footer>EKRAI · автономная браузерная игра</footer></main>
<script>
const chapters=[
{title:'I. Шёпот руин',intro:'Ты просыпаешься среди руин. Вдалеке слышны шаги и скрежет металла.',enemies:[['Осквернённый страж',34,7],['Вожак падших',48,9]],reward:'В руинах найден ключ от древних ворот.'},
{title:'II. Затопленный храм',intro:'Туман скрывает ступени храма. В воде просыпается древнее существо.',enemies:[['Храмовый хранитель',52,10],['Исобу',86,13]],reward:'Исобу повержен. Его печать ослабляет Разлом.'},
{title:'III. Кровавая крепость',intro:'За крепостными стенами ждёт палач, чьё имя произносят шёпотом.',enemies:[['Рыцарь крепости',72,12],['Бастард',105,15]],reward:'Бастард пал. Тебе достался осколок силы.'},
{title:'IV. Предел пустоты',intro:'Здесь время течёт иначе, а тени помнят всех погибших.',enemies:[['Тень забвения',92,15],['Пожиратель памяти',115,17]],reward:'Ты выдержал испытание пустоты.'},
{title:'V. Сердце Разлома',intro:'В центре расколотого мира тебя ждёт Нирвана.',enemies:[['Вестник Нирваны',115,17],['Нирвана',160,20]],reward:'Сердце Разлома в твоих руках.'}
];
const classes={'Страж':{hp:130,atk:13,def:5,mp:24},'Арканист':{hp:88,atk:11,def:2,mp:50},'Следопыт':{hp:105,atk:14,def:3,mp:30}};
let p=null,e=null,guard=false,turn=0;
const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function start(c){let b=classes[c];p={c,hp:b.hp,max:b.hp,atk:b.atk,def:b.def,mp:b.mp,maxMp:b.mp,lvl:1,xp:0,potions:4,gold:0,ch:0,idx:0,kills:0};$('start').classList.add('hidden');$('game').classList.remove('hidden');log('Путь начинается. '+c+' вступает в Разлом.');enter()}
function log(t){$('log').textContent+='\n'+t;$('log').scrollTop=$('log').scrollHeight}
function enter(){if(p.ch>=chapters.length){ending();return}let c=chapters[p.ch];$('chapter').textContent=c.title;$('story').textContent=c.intro;spawn()}
function spawn(){let c=chapters[p.ch];if(p.idx>=c.enemies.length){$('enemyBox').classList.add('hidden');$('story').textContent=c.reward;log('✓ '+c.reward);p.gold+=30+p.ch*20;p.potions+=2;p.hp=Math.min(p.max,p.hp+Math.floor(p.max*.45));p.mp=p.max;actions([['Перейти в следующую главу',()=>{p.ch++;p.idx=0;save();enter()}],['Отдохнуть (+30 здоровья)',()=>{p.hp=Math.min(p.max,p.hp+30);render()}]]);render();return}let a=c.enemies[p.idx];e={name:a[0],hp:a[1],max:a[1],atk:a[2],def:p.idx?3:1};guard=false;log('⚔ На пути: '+e.name);$('enemyBox').classList.remove('hidden');render()}
function actions(arr){$('actions').innerHTML='';for(let [t,f] of arr){let b=document.createElement('button');b.textContent=t;b.onclick=f;$('actions').append(b)}}
function render(){if(!p)return;$('stats').innerHTML='<span>🧙 '+p.c+'</span><span>❤️ '+p.hp+'/'+p.max+'</span><span>🔮 '+p.mp+'/'+p.maxMp+'</span><span>⭐ Ур. '+p.lvl+'</span><span>🧪 '+p.potions+'</span><span>🪙 '+p.gold+'</span>';if(e&&e.hp>0){$('enemyName').textContent=e.name;$('enemyHp').style.width=Math.max(0,100*e.hp/e.max)+'%';$('enemyStats').textContent='Здоровье '+e.hp+'/'+e.max+' · Урон '+e.atk;actions([['⚔ Атака',()=>fight('attack')],['✨ Особый приём (8 маны)',()=>fight('skill')],['🛡 Защита (+4 маны)',()=>fight('guard')],['🧪 Зелье (+45 HP)',()=>fight('potion')]])}}
function fight(type){if(!e||e.hp<=0)return;let dmg=0;if(type==='attack'){dmg=Math.max(1,p.atk+rnd(-3,5)-e.def);if(p.c==='Следопыт'&&Math.random()<.3){dmg*=2;log('💥 Критический удар!')}p.mp=Math.min(p.maxMp,p.mp+3)}else if(type==='skill'){if(p.mp<8){log('Недостаточно маны!');return}p.mp-=8;dmg=p.c==='Арканист'?p.atk*3+rnd(1,8):p.c==='Страж'?p.atk*2+rnd(0,5):p.atk*2+rnd(3,11);dmg=Math.max(1,dmg-e.def);if(p.c==='Страж')guard=true}else if(type==='guard'){guard=true;p.mp=Math.min(p.maxMp,p.mp+4);log('🛡 Ты приготовился отражать удар.')}else if(type==='potion'){if(!p.potions){log('Зелья закончились.');return}p.potions--;p.hp=Math.min(p.max,p.hp+45);log('🧪 Восстановлено здоровье.')}if(dmg){e.hp=Math.max(0,e.hp-dmg);log('Ты наносишь '+dmg+' урона.')}if(e.hp<=0){win();return}let hit=Math.max(1,e.atk+rnd(-3,4)-p.def-(guard?Math.ceil(e.atk*.65):0));guard=false;p.hp=Math.max(0,p.hp-hit);log(e.name+' наносит '+hit+' урона.');if(p.hp<=0){log('☠ Ты пал. Попробуй снова с последнего боя.');actions([['Возродиться (потерять 20 монет)',()=>{p.gold=Math.max(0,p.gold-20);p.hp=p.max;p.mp=p.max;spawn()}],['Загрузить сохранение',load]]);return}render()}
function win(){log('🏆 Победа над '+e.name+'!');p.gold+=rnd(12,22);p.xp+=25;p.kills++;if(p.xp>=50){p.xp-=50;p.lvl++;p.max+=14;p.atk+=3;p.def++;p.maxMp+=5;p.hp=p.max;p.mp=p.max;log('⬆ Новый уровень: '+p.lvl)}p.idx++;e=null;spawn();save()}
function ending(){$('enemyBox').classList.add('hidden');$('chapter').textContent='Финал';$('story').textContent='Нирвана повержена. Перед тобой сердце Разлома. Как поступить?';actions([['Запечатать Разлом',()=>finish('Ты спас мир, но магия навсегда покинула его.')],['Принять силу Разлома',()=>finish('Ты стал новым хранителем границы миров.')]])}
function finish(t){$('story').textContent=t;log('★ КОНЕЦ: '+t);actions([['Начать новое приключение',reset]]);localStorage.removeItem('ekrai_save')}
function save(){if(p){localStorage.setItem('ekrai_save',JSON.stringify(p));log('💾 Сохранено в браузере.')}}
function load(){let s=localStorage.getItem('ekrai_save');if(!s){alert('Сохранений пока нет');return}p=JSON.parse(s);e=null;$('start').classList.add('hidden');$('game').classList.remove('hidden');$('log').textContent='';log('Сохранение загружено.');enter()}
function reset(){localStorage.removeItem('ekrai_save');location.reload()}
</script></body></html>
